[build]
  publish = "."
  functions = "netlify/functions"

# Keeps the frontend's fetch('/api/contact') working unchanged on Netlify.
# Netlify's real function URL is /.netlify/functions/contact; this redirect
# maps the familiar /api/* path to it, so index.html never had to change.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
